<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serial Audio</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4.5" height="7" rx="1.5"/><rect x="17" y="13" width="4.5" height="7" rx="1.5"/></svg>Serial Audio</a>
  <nav>
    <a href="#/" data-nav="library">Library</a>
    <a href="#/jobs" data-nav="jobs">Jobs <span id="queue-count" class="count" hidden></span></a>
  </nav>
  <a id="activity" class="activity" href="#/jobs" title="What the machine is doing"></a>
</header>

<main id="view" tabindex="-1"></main>

<footer id="player" class="player" hidden>
  <div class="pl-head">
    <div class="pl-title" id="pl-title"></div>
    <div class="pl-tools">
      <button class="icon" data-act="pl-skip" data-by="-15" title="Back 15 seconds" aria-label="Back 15 seconds">−15</button>
      <button class="icon" data-act="pl-skip" data-by="30" title="Forward 30 seconds" aria-label="Forward 30 seconds">+30</button>
      <select id="pl-rate" aria-label="Playback speed">
        <option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
      </select>
      <button class="icon" data-act="pl-close" title="Close player" aria-label="Close player">✕</button>
    </div>
  </div>
  <audio id="pl-audio" controls preload="metadata"></audio>
</footer>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <header><h2 id="dlg-title"></h2><button type="button" class="icon" data-act="dlg-close" aria-label="Close">✕</button></header>
    <div id="dlg-body" class="dlg-body"></div>
    <footer id="dlg-foot"></footer>
  </form>
</dialog>

<dialog id="logdlg" class="wide">
  <div class="log-wrap">
    <header><h2 id="log-title"></h2>
      <label class="inline"><input type="checkbox" id="log-follow" checked> follow</label>
      <button type="button" class="icon" data-act="log-close" aria-label="Close">✕</button></header>
    <pre id="log-text" class="log"></pre>
  </div>
</dialog>

<div id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
